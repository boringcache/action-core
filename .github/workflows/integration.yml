name: Integration Tests

on:
  push:
    branches: [main]
    paths:
      - 'lib/**'
      - 'package.json'
      - 'package-lock.json'
      - '.github/workflows/**'
  pull_request:
    branches: [main]
  workflow_dispatch:
  schedule:
    - cron: '0 6 * * 1'

permissions:
  contents: read

concurrency:
  group: action-core-integration-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  integration-linux:
    name: Integration (Linux ${{ matrix.arch }})
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: ubuntu-latest
            arch: x64
          - runner: ubuntu-24.04-arm
            arch: arm64
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: '24'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Build
        run: npm run build

      - name: Test CLI download and caching
        run: |
          node -e "
            const { ensureBoringCache, isCliAvailable } = require('./dist/index.js');

            async function main() {
              console.log('=== First install (should download) ===');
              const before = await isCliAvailable();
              console.log('CLI available before:', before);

              await ensureBoringCache({ version: 'v1.1.0' });

              const after = await isCliAvailable();
              console.log('CLI available after:', after);
              if (!after) throw new Error('CLI should be available');

              console.log('=== Second install (should use cache) ===');
              const start = Date.now();
              await ensureBoringCache({ version: 'v1.1.0' });
              console.log('Cached install took:', Date.now() - start, 'ms');

              console.log('Integration test passed!');
            }

            main().catch(e => { console.error(e); process.exit(1); });
          "

      - name: Verify CLI works
        run: boringcache --version

  integration-macos:
    name: Integration (macOS ARM64)
    runs-on: macos-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: '24'
          cache: 'npm'

      - name: Install and test
        run: |
          npm ci
          npm run build
          node -e "
            const { ensureBoringCache, isCliAvailable } = require('./dist/index.js');
            async function main() {
              await ensureBoringCache({ version: 'v1.1.0' });
              if (!(await isCliAvailable())) throw new Error('CLI not available');
              console.log('macOS test passed!');
            }
            main().catch(e => { console.error(e); process.exit(1); });
          "

      - name: Verify CLI
        run: boringcache --version

  integration-windows:
    name: Integration (Windows x64)
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: '24'
          cache: 'npm'

      - name: Install and test
        shell: pwsh
        run: |
          npm ci
          npm run build
          node -e "
            const { ensureBoringCache, isCliAvailable } = require('./dist/index.js');
            async function main() {
              await ensureBoringCache({ version: 'v1.1.0' });
              if (!(await isCliAvailable())) throw new Error('CLI not available');
              console.log('Windows test passed!');
            }
            main().catch(e => { console.error(e); process.exit(1); });
          "

      - name: Verify CLI
        run: boringcache --version

  integration-cache-disabled:
    name: Integration (cache disabled)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: '24'
          cache: 'npm'

      - name: Test with cache disabled
        run: |
          npm ci
          npm run build
          node -e "
            const { ensureBoringCache } = require('./dist/index.js');
            async function main() {
              await ensureBoringCache({ version: 'v1.1.0', cache: false });
              console.log('Cache disabled test passed!');
            }
            main().catch(e => { console.error(e); process.exit(1); });
          "
