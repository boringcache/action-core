name: Integration Tests

on:
  push:
    branches: [main]
    paths:
      - 'lib/**'
      - 'package.json'
      - 'package-lock.json'
      - '.github/workflows/**'
  pull_request:
    branches: [main]
  workflow_dispatch:
  schedule:
    - cron: '0 6 * * 1'

permissions:
  contents: read

concurrency:
  group: action-core-integration-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  integration-linux:
    name: Integration (Linux ${{ matrix.arch }})
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: ubuntu-latest
            arch: x64
          - runner: ubuntu-24.04-arm
            arch: arm64
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: '24'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Build
        run: npm run build

      - name: Test proxy startup contract
        env:
          BORINGCACHE_SAVE_TOKEN: integration-save-token
        run: |
          set -euo pipefail

          tmp_bin="$RUNNER_TEMP/action-core-proxy-bin"
          mkdir -p "$tmp_bin"
          cat >"$tmp_bin/boringcache" <<'EOF'
          #!/usr/bin/env node
          const fs = require('fs');

          const args = process.argv.slice(2);
          let readyFile = '';
          for (let i = 0; i < args.length; i += 1) {
            if (args[i] === '--ready-file') {
              readyFile = args[i + 1];
              i += 1;
            }
          }

          const keepAlive = setInterval(() => {}, 1000);
          const readyTimer = setTimeout(() => {
            if (readyFile) {
              fs.writeFileSync(readyFile, 'ready\n');
            }
          }, 1200);

          process.on('SIGTERM', () => {
            clearInterval(keepAlive);
            clearTimeout(readyTimer);
            process.exit(0);
          });
          EOF
          chmod +x "$tmp_bin/boringcache"

          PATH="$tmp_bin:$PATH" node -e "
            const fs = require('fs');
            const os = require('os');
            const path = require('path');
            const { findAvailablePort, startRegistryProxy, stopRegistryProxy } = require('./dist/index.js');

            async function main() {
              const port = await findAvailablePort();
              const readyFile = path.join(os.tmpdir(), \`boringcache-proxy-\${port}.ready\`);
              const startedAt = Date.now();
              const proxy = await startRegistryProxy({
                command: 'cache-registry',
                workspace: 'org/repo',
                tag: 'integration-proxy',
                port,
              });
              const elapsed = Date.now() - startedAt;
              if (elapsed < 1000) {
                throw new Error(\`startRegistryProxy returned before proxy became ready (\${elapsed}ms)\`);
              }
              if (fs.existsSync(readyFile)) {
                throw new Error('startRegistryProxy left the ready marker behind');
              }

              await stopRegistryProxy(proxy.pid);
            }

            main().catch((error) => {
              console.error(error);
              process.exit(1);
            });
          "

      - name: Test CLI download and caching
        run: |
          node -e "
            const { ensureBoringCache, isCliAvailable } = require('./dist/index.js');

            async function main() {
              console.log('=== First install (should download) ===');
              const before = await isCliAvailable();
              console.log('CLI available before:', before);

              await ensureBoringCache({ version: 'v1.12.32' });

              const after = await isCliAvailable();
              console.log('CLI available after:', after);
              if (!after) throw new Error('CLI should be available');

              console.log('=== Second install (should use cache) ===');
              const start = Date.now();
              await ensureBoringCache({ version: 'v1.12.32' });
              console.log('Cached install took:', Date.now() - start, 'ms');

              console.log('Integration test passed!');
            }

            main().catch(e => { console.error(e); process.exit(1); });
          "

      - name: Verify CLI works
        run: boringcache --version

  integration-macos:
    name: Integration (macOS ARM64)
    runs-on: macos-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: '24'
          cache: 'npm'

      - name: Install and test
        run: |
          npm ci
          npm run build
          node -e "
            const { ensureBoringCache, isCliAvailable } = require('./dist/index.js');
            async function main() {
              await ensureBoringCache({ version: 'v1.12.32' });
              if (!(await isCliAvailable())) throw new Error('CLI not available');
              console.log('macOS test passed!');
            }
            main().catch(e => { console.error(e); process.exit(1); });
          "

      - name: Verify CLI
        run: boringcache --version

  integration-windows:
    name: Integration (Windows x64)
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: '24'
          cache: 'npm'

      - name: Install and test
        shell: pwsh
        run: |
          npm ci
          npm run build
          node -e "
            const { ensureBoringCache, isCliAvailable } = require('./dist/index.js');
            async function main() {
              await ensureBoringCache({ version: 'v1.12.32' });
              if (!(await isCliAvailable())) throw new Error('CLI not available');
              console.log('Windows test passed!');
            }
            main().catch(e => { console.error(e); process.exit(1); });
          "

      - name: Verify CLI
        run: boringcache --version

  integration-cache-disabled:
    name: Integration (cache disabled)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: '24'
          cache: 'npm'

      - name: Test with cache disabled
        run: |
          npm ci
          npm run build
          node -e "
            const { ensureBoringCache } = require('./dist/index.js');
            async function main() {
              await ensureBoringCache({ version: 'v1.12.32', cache: false });
              console.log('Cache disabled test passed!');
            }
            main().catch(e => { console.error(e); process.exit(1); });
          "
